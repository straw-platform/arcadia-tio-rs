# Arcadia TIO Rust wrapper public workspace
# Requires cargo-make: cargo install cargo-make

[config]
default_to_workspace = false

[tasks.default]
description = "Show available tasks"
alias = "help"

[tasks.help]
description = "Show available tasks"
script_runner = "@shell"
script = '''
echo "Common tasks:"
echo "  cargo make build              # build all crates with all features"
echo "  cargo make check              # cargo check all crates with all features"
echo "  cargo make test               # run all-feature workspace tests with the local native library"
echo "  cargo make test-core-reader   # run C-ABI-free OCB core reader tests"
echo "  cargo make test-core-reader-no-cabi # assert core reader has no C ABI dependency edge"
echo "  cargo make test-matrix        # run default/no-default/optional/all-feature wrapper tests"
echo "  cargo make test-default       # run safe wrapper tests with default features"
echo "  cargo make test-no-default    # run safe wrapper tests with --no-default-features"
echo "  cargo make test-arrow-ndarray # run safe wrapper tests with arrow,ndarray"
echo "  cargo make test-csv-parquet   # run safe wrapper tests with csv,parquet"
echo "  cargo make test-ocb           # run OCB feature tests and examples"
echo "  cargo make test-all-features  # run safe wrapper tests with --all-features"
echo "  cargo make fmt                # verify rustfmt"
echo "  cargo make module-size-check  # enforce post-split implementation ratchets"
echo "  cargo make ci                 # fmt + size/core/no-C-ABI/public-sys guards + feature matrix"
echo "  cargo make native-info        # inspect native library path, size, mode, and symbols"
echo "  cargo make test-sys-public-constants # compile public sys ABI constant/layout guards"
echo "  cargo make test-private-c-header-parity # opt-in private C header/sys parity gate"
echo ""
echo "Native library:"
echo "  Tasks use ARCADIA_TIO_CAPI_LIB_DIR when set, otherwise native/<rustc-host-triple>/lib."
echo "  The native/ directory is local-only and ignored; do not commit native libraries."
'''

[tasks.native-info]
description = "Print detected native library configuration"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
TARGET_TRIPLE="${TARGET_TRIPLE:-$(rustc -vV | awk '/^host:/ { print $2 }')}"
LINK_KIND="${ARCADIA_TIO_CAPI_LINK_KIND:-dylib}"
LIB_DIR="${ARCADIA_TIO_CAPI_LIB_DIR:-${ARCADIA_TIO_NATIVE_LIB_DIR:-$ROOT_DIR/native/$TARGET_TRIPLE/lib}}"
if [ -n "${ARCADIA_TIO_CAPI_INCLUDE_DIR:-}" ]; then
  INCLUDE_DIR="$ARCADIA_TIO_CAPI_INCLUDE_DIR"
elif [ -z "${ARCADIA_TIO_CAPI_LIB_DIR:-}" ] && [ -z "${ARCADIA_TIO_NATIVE_LIB_DIR:-}" ]; then
  INCLUDE_DIR="$ROOT_DIR/native/$TARGET_TRIPLE/include"
else
  INCLUDE_DIR=""
fi
echo "target_triple=$TARGET_TRIPLE"
echo "link_kind=$LINK_KIND"
echo "native_lib_dir=$LIB_DIR"
if [ ! -d "$LIB_DIR" ]; then
  echo "native library directory is missing" >&2
  echo "Copy libarcadia_tio_capi into native/$TARGET_TRIPLE/lib or set ARCADIA_TIO_CAPI_LIB_DIR." >&2
  exit 1
fi
case "$LINK_KIND:$TARGET_TRIPLE" in
  static:*windows*) CANDIDATES="arcadia_tio_capi.lib libarcadia_tio_capi.a" ;;
  static:*) CANDIDATES="libarcadia_tio_capi.a" ;;
  dylib:*windows*) CANDIDATES="arcadia_tio_capi.dll arcadia_tio_capi.lib" ;;
  dylib:*apple*|dylib:*darwin*) CANDIDATES="libarcadia_tio_capi.dylib" ;;
  dylib:*) CANDIDATES="libarcadia_tio_capi.so" ;;
  *) echo "ARCADIA_TIO_CAPI_LINK_KIND must be dylib or static, got: $LINK_KIND" >&2; exit 1 ;;
esac
FOUND_LIB=""
for name in $CANDIDATES; do
  if [ -f "$LIB_DIR/$name" ]; then
    FOUND_LIB="$LIB_DIR/$name"
    break
  fi
done
if [ -z "$FOUND_LIB" ]; then
  echo "expected native library not found in $LIB_DIR" >&2
  echo "expected one of: $CANDIDATES" >&2
  exit 1
fi
echo "native_lib_file=$FOUND_LIB"
echo "native_lib_size_bytes=$(wc -c < "$FOUND_LIB" | tr -d ' ')"
if NATIVE_LIB_MODE="$(stat -c '%A' "$FOUND_LIB" 2>/dev/null)" \
  && printf '%s\n' "$NATIVE_LIB_MODE" | grep -Eq '^[bcdlps-][rwxStTs-]{9}[.+]?$'; then
  echo "native_lib_mode=$NATIVE_LIB_MODE"
elif NATIVE_LIB_MODE="$(stat -f '%Sp' "$FOUND_LIB" 2>/dev/null)" \
  && printf '%s\n' "$NATIVE_LIB_MODE" | grep -Eq '^[bcdlps-][rwxStTs-]{9}[.+]?$'; then
  echo "native_lib_mode=$NATIVE_LIB_MODE"
else
  echo "native_lib_mode=unknown_stat_not_supported"
fi
REQUIRED_ABI_SYMBOLS="arcadia_tio_abi_version arcadia_tio_compaction_abi_version"
REQUIRED_OCB_SYMBOLS="arcadia_tio_ocb_open_with_options arcadia_tio_ocb_create arcadia_tio_ocb_append arcadia_tio_ocb_read_batches arcadia_tio_ocb_cleanup_orphan_tail"
if command -v nm >/dev/null 2>&1; then
  if [ "$LINK_KIND" = "dylib" ] && NM_OUTPUT="$(nm -D -g -P "$FOUND_LIB" 2>/dev/null)"; then
    :
  else
    NM_OUTPUT="$(nm -g -P "$FOUND_LIB" 2>/dev/null || true)"
  fi
  NM_DEFINED_SYMBOLS="$(
    printf '%s\n' "$NM_OUTPUT" | awk '
      {
        for (field = 2; field <= NF; field++) {
          if ($field ~ /^[ABCDGIRSTVW]$/) {
            name = $(field - 1)
            sub(/^_/, "", name)
            sub(/@.*/, "", name)
            print name
            break
          }
        }
      }
    ' | LC_ALL=C sort -u
  )"
  MISSING_ABI_SYMBOLS=""
  for symbol in $REQUIRED_ABI_SYMBOLS; do
    if ! printf '%s\n' "$NM_DEFINED_SYMBOLS" | grep -Fqx "$symbol"; then
      MISSING_ABI_SYMBOLS="$MISSING_ABI_SYMBOLS $symbol"
    fi
  done
  if [ -n "$MISSING_ABI_SYMBOLS" ]; then
    echo "abi_symbols=missing:$MISSING_ABI_SYMBOLS" >&2
    exit 1
  fi
  echo "abi_symbols=present"
  MISSING_OCB_SYMBOLS=""
  for symbol in $REQUIRED_OCB_SYMBOLS; do
    if ! printf '%s\n' "$NM_DEFINED_SYMBOLS" | grep -Fqx "$symbol"; then
      MISSING_OCB_SYMBOLS="$MISSING_OCB_SYMBOLS $symbol"
    fi
  done
  if [ -z "$MISSING_OCB_SYMBOLS" ]; then
    echo "ocb_symbols=present"
  else
    echo "ocb_symbols=missing:$MISSING_OCB_SYMBOLS"
    if [ "${ARCADIA_TIO_REQUIRE_OCB_SYMBOLS:-0}" = "1" ]; then
      echo "required OCB symbols missing from native library" >&2
      exit 1
    fi
  fi
else
  echo "abi_symbols=unknown_nm_not_found"
  echo "ocb_symbols=unknown_nm_not_found"
  if [ "${ARCADIA_TIO_REQUIRE_OCB_SYMBOLS:-0}" = "1" ]; then
    echo "cannot verify required OCB symbols because nm is unavailable" >&2
    exit 1
  fi
fi
if [ -d "$INCLUDE_DIR" ]; then
  echo "native_include_dir=$INCLUDE_DIR"
fi
echo "native_lib_listing:"
ls -ld "$FOUND_LIB"
'''

[tasks.build]
clear = true
description = "Build all crates with all features"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo build --workspace --all-features
'''

[tasks.check]
clear = true
description = "Check all crates with all features"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo check --workspace --all-features
'''

[tasks.test]
clear = true
description = "Run all-feature workspace tests with the local native library"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo test --workspace --all-features
'''

[tasks.test-core-reader]
clear = true
description = "Run C-ABI-free arcadia-tio-ocb-core tests"
command = "cargo"
args = ["test", "-p", "arcadia-tio-ocb-core"]

[tasks.test-core-reader-tree]
clear = true
description = "Print the C-ABI-free arcadia-tio-ocb-core dependency tree"
command = "cargo"
args = ["tree", "-p", "arcadia-tio-ocb-core", "--edges", "normal"]


[tasks.test-core-reader-no-cabi]
clear = true
description = "Assert arcadia-tio-ocb-core does not depend on C ABI wrapper crates"
script_runner = "@shell"
script = '''
set -e
TREE="$(cargo tree -p arcadia-tio-ocb-core --edges normal)"
printf '%s\n' "$TREE"
for forbidden in arcadia-tio-rs arcadia-tio-sys arcadia-tio-capi; do
  if printf '%s\n' "$TREE" | grep -q "${forbidden} v"; then
    echo "forbidden dependency edge found in arcadia-tio-ocb-core tree: $forbidden" >&2
    exit 1
  fi
done
if ! printf '%s\n' "$TREE" | grep -q "zstd v"; then
  echo "expected zstd dependency tail missing from arcadia-tio-ocb-core tree" >&2
  exit 1
fi
'''

[tasks.test-sys-public-constants]
clear = true
description = "Compile public arcadia-tio-sys ABI constant and layout guards without claiming private-header parity"
script_runner = "@shell"
script = '''
set -e
unset ARCADIA_TIO_CAPI_LIB_DIR ARCADIA_TIO_NATIVE_LIB_DIR ARCADIA_TIO_CAPI_INCLUDE_DIR
ARCADIA_TIO_CAPI_SYSTEM_FALLBACK=1 cargo check --locked --offline -p arcadia-tio-sys --all-features --test constants
'''

[tasks.test-private-c-header-parity]
clear = true
description = "Run the explicit private C header/sys parity integration gate"
script_runner = "@shell"
script = '''
set -e
if [ -z "${ARCADIA_TIO_CAPI_INCLUDE_DIR:-}" ]; then
  echo "ARCADIA_TIO_CAPI_INCLUDE_DIR must name the checked private C include root" >&2
  exit 1
fi
if [ ! -d "$ARCADIA_TIO_CAPI_INCLUDE_DIR" ]; then
  echo "ARCADIA_TIO_CAPI_INCLUDE_DIR is not an existing directory: $ARCADIA_TIO_CAPI_INCLUDE_DIR" >&2
  exit 1
fi
for header in functions.h types.h arrow_c_data.h; do
  if [ ! -r "$ARCADIA_TIO_CAPI_INCLUDE_DIR/arcadia/tio/$header" ]; then
    echo "required private C header is unreadable: $ARCADIA_TIO_CAPI_INCLUDE_DIR/arcadia/tio/$header" >&2
    exit 1
  fi
done
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
TEST_NAME="deferred_c_abi_gap_matches_expected_inventory"
TEST_LIST="$(
  "$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" \
    cargo test --locked --offline -p arcadia-tio-sys --test constants \
    -- --ignored --list
)"
MATCH_COUNT="$(printf '%s\n' "$TEST_LIST" | awk -F': ' -v name="$TEST_NAME" '$1 == name && $2 == "test" { count++ } END { print count + 0 }')"
if [ "$MATCH_COUNT" -ne 1 ]; then
  printf '%s\n' "$TEST_LIST" >&2
  echo "private C header parity gate expected exactly one ignored test named $TEST_NAME; found $MATCH_COUNT" >&2
  exit 1
fi
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" \
  cargo test --locked --offline -p arcadia-tio-sys --test constants \
  "$TEST_NAME" -- --ignored --exact
'''

[tasks.test-default]
clear = true
description = "Run arcadia-tio-rs tests with default features"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo test -p arcadia-tio-rs
'''

[tasks.test-no-default]
clear = true
description = "Run arcadia-tio-rs tests with --no-default-features"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo test -p arcadia-tio-rs --no-default-features
'''

[tasks.test-arrow-ndarray]
clear = true
description = "Run arcadia-tio-rs tests with arrow and ndarray features"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo test -p arcadia-tio-rs --no-default-features --features arrow,ndarray
'''

[tasks.test-csv-parquet]
clear = true
description = "Run arcadia-tio-rs tests with csv and parquet features"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo test -p arcadia-tio-rs --no-default-features --features csv,parquet
'''

[tasks.test-ocb]
clear = true
description = "Run arcadia-tio-rs OCB feature tests and examples"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo test -p arcadia-tio-rs --no-default-features --features format-ocb --test ocb
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo run -p arcadia-tio-rs --no-default-features --features format-ocb --example ocb_roundtrip
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo check -p arcadia-tio-rs --no-default-features --features format-ocb,parquet --example l2_parquet_to_ocb
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo check -p arcadia-tio-rs --no-default-features --features format-ocb --example l2_ocb_load
'''

[tasks.test-all-features]
clear = true
description = "Run arcadia-tio-rs tests with --all-features"
script_runner = "@shell"
script = '''
set -e
ROOT_DIR="${CARGO_MAKE_WORKING_DIRECTORY:-$(pwd)}"
"$ROOT_DIR/examples/tutorials/run/with_native_lib.sh" cargo test -p arcadia-tio-rs --all-features
'''

[tasks.test-matrix]
description = "Run public Rust wrapper feature matrix"
dependencies = ["test-default", "test-no-default", "test-arrow-ndarray", "test-csv-parquet", "test-ocb", "test-all-features"]

[tasks.fmt]
clear = true
description = "Verify rustfmt"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.module-size-check]
clear = true
description = "Enforce post-split implementation line-count ratchets"
command = "python3"
args = ["scripts/check_module_size_budgets.py"]

[tasks.ci]
description = "Run fmt, size/core/no-C-ABI/public-sys guards, all-feature check, and the feature test matrix"
dependencies = ["fmt", "module-size-check", "test-core-reader", "test-core-reader-no-cabi", "test-sys-public-constants", "check", "test-matrix"]
